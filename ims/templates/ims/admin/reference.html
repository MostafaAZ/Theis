{% extends "ims/base.html" %}
{% block title %}Reference data{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Reference data</h1>
<div class="row g-3">{% for key, title, n in lists %}<div class="col-6 col-md-4 col-xl-3"><a href="/admin/reference/{{ key }}/" class="card kpi text-decoration-none"><div class="card-body"><div class="kpi-label">{{ title }}</div><div class="kpi-value">{{ n }}</div></div></a></div>{% endfor %}</div>
{% endblock %}
