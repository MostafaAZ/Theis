{% extends "ims/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">{{ title }}</h1>
<div class="card"><div class="card-body">
<form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %}>{% csrf_token %}
  {% include "ims/_fields.html" %}
  <div class="mt-4 d-flex gap-2">
    <button class="btn btn-primary">Save</button>
    <a href="{{ back }}" class="btn btn-outline-secondary">Back</a>
    {% if can_delete %}<button name="delete" value="1" class="btn btn-outline-danger ms-auto" onclick="return confirm('Delete or deactivate this entry?')">Delete / deactivate</button>{% endif %}
  </div>
</form>
</div></div>
{% endblock %}
