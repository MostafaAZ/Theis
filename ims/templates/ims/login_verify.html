{% extends "ims/base.html" %}
{% block title %}Verify{% endblock %}
{% block anon %}
<div class="auth-card">
  <div class="text-center mb-4"><span class="brand-mark mx-auto mb-3" style="width:52px;height:52px;font-size:1.5rem"><i class="bi bi-shield-check"></i></span>
  <h1 class="h4 mb-1">Two-step verification</h1><p class="text-muted">Enter the 6-digit code sent to <strong>{{ pending.email }}</strong>.</p></div>
  <div class="card"><div class="card-body p-4">
    <form method="post">{% csrf_token %}{% include "ims/_fields.html" with col="col-12" %}
      <button class="btn btn-primary w-100 mt-4 py-2">Verify and continue</button></form>
    <form method="post" class="mt-2">{% csrf_token %}<button name="resend" value="1" class="btn btn-link w-100">Send a new code</button></form>
  </div></div>
  <p class="text-center mt-3"><a href="/login/">← Back to log in</a></p>
</div>
{% endblock %}
