{% extends "ims/base.html" %}
{% block title %}Verify{% endblock %}
{% block anon %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <h1 class="h4 text-center mb-3">Two-factor verification</h1>
  <p class="text-center text-muted">Enter the 6-digit code sent to {{ pending.email }}.</p>
  <div class="card shadow-sm"><div class="card-body p-4">
    <form method="post">{% csrf_token %}{% include "ims/_fields.html" with col="col-12" %}
      <button class="btn btn-primary w-100 mt-4">Verify</button></form>
    <form method="post" class="mt-2">{% csrf_token %}<button name="resend" value="1" class="btn btn-link w-100">Resend code</button></form>
  </div></div>
  <p class="text-center mt-3"><a href="/login/">Back to log in</a></p>
</div></div>
{% endblock %}
