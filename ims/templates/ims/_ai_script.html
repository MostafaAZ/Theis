<script>
(function () {
  const btn = document.getElementById("ai-btn");
  if (!btn) return;
  const csrf = "{{ csrf_token }}";
  function list(id, items) {
    const ul = document.getElementById(id);
    ul.replaceChildren(...items.map(t => { const li = document.createElement("li"); li.textContent = t; return li; }));
  }
  function setText(root, sel, text) {
    const el = root.querySelector(sel);
    if (!el) return;
    el.textContent = text || "";
  }
  btn.addEventListener("click", async () => {
    const panel = document.getElementById("briefing"), err = document.getElementById("ai-error");
    err.hidden = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Claude is analysing…';
    panel.classList.add("ai-loading");
    const body = new URLSearchParams(new FormData(document.getElementById("filters")));
    try {
      const r = await fetch("{% url 'ims:analytics_ai' %}", {method: "POST", body,
        headers: {"X-CSRFToken": csrf}});
      const data = await r.json().catch(() => ({error: "AI analysis failed (" + r.status + ")."}));
      if (!r.ok) throw new Error(data.error || "AI analysis failed.");
      document.getElementById("briefing-summary").textContent = data.summary;
      list("briefing-findings", data.findings);
      list("briefing-impacts", data.impacts);
      const recs = document.getElementById("briefing-recs");
      recs.replaceChildren(...data.recommendations.map(r => {
        const li = document.createElement("li"), d = document.createElement("div"), b = document.createElement("strong");
        li.textContent = r.text; d.className = "small text-muted mt-1"; b.textContent = "Based on: ";
        d.append(b, r.basis); li.append(d); return li; }));
      list("briefing-risks", data.risks);
      document.getElementById("briefing-risks-wrap").hidden = !data.risks.length;
      const src = document.getElementById("briefing-src");
      src.classList.add("ai");
      src.innerHTML = '<i class="bi bi-stars"></i>AI analysis · Claude';
      Object.entries(data.charts || {}).forEach(([id, a]) => {
        const box = document.querySelector('.story-analysis[data-chart="' + id + '"]');
        if (!box) return;
        setText(box, ".a-explain", a.explain);
        setText(box, ".a-impact", a.impact);
        setText(box, ".a-recommendation", a.recommendation);
        setText(box, ".a-basis", a.basis);
        const s = box.querySelector(".analysis-src");
        s.classList.add("ai");
        s.querySelector(".src-label").textContent = "AI analysis · Claude";
      });
      btn.innerHTML = '<i class="bi bi-check2 me-1"></i>AI analysis ready';
    } catch (e) {
      err.textContent = e.message;
      err.hidden = false;
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-stars me-1"></i>Analyse with AI';
    } finally {
      panel.classList.remove("ai-loading");
    }
  });
})();
</script>
